qdrant:
  host: "qdrant"
  port: 6333
  timeout: 120
  check_compatibility: false
  api_key: "QDRANT_API_KEY"

collection:
  name: "documents"

model:
  embedding: "BAAI/bge-m3"
  reranker: "BAAI/bge-reranker-v2-m3"

indexing:
  batch_size: 5
  documents_path: "documents"

reranker_api:
  enabled: true
  base_url: "https://albert.api.etalab.gouv.fr"
  api_key_env: "ALBERT_API_KEY"
  model: "BAAI/bge-reranker-v2-m3"
  timeout: 30
  retry_attempts: 1
  retry_delay: 1.0
  max_consecutive_errors: 3
  max_batch_size: 100

search:
  limit: 3
  candidate_multiplier: 8
  min_candidates: 250
  scroll_limit_per_doc: 10000
  window_radius: 5
  full_document_chunk_threshold: 15
  rerank_pool_size: 60
  hybrid_dense_weight: 0.7

  aggregation_top_k: 3
  aggregation_max_weight: 0.9 # poids du score max
  aggregation_mean_weight: 0.1 # poids de la moyenne des top_k
  max_chunks_per_document: 3
